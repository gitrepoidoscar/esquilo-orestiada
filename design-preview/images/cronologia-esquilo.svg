<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d" font-family="Georgia, 'Iowan Old Style', serif">
  <title id="t">Cronología de Esquilo con grado de certeza</title>
  <desc id="d">Línea de tiempo de 530 a 400 a. C. Cada fecha lleva un color según su estatus: atestiguado por documento antiguo, tradición antigua o reconstrucción moderna. Hacia 525/524 nacimiento, calculado a partir del Mármol de Paros. 490 Maratón. 485/484 primera victoria. 480 Salamina, según tradición. 472 Persas. Años 470 viaje a Sicilia, tradición. 467 Siete contra Tebas. Hacia 463 Suplicantes, reconstrucción por un papiro. 458 Orestíada. 456/455 muerte en Gela. 405 Ranas de Aristófanes.</desc>
  <defs>
    <pattern id="meander" width="24" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 11 H20 V1 H4 V7 H14 V4 H9" fill="none" stroke="#b5532a" stroke-width="1.6"/>
    </pattern>
  </defs>
  <rect width="900" height="420" fill="#efe4cf"/>
  <rect width="900" height="12" fill="url(#meander)"/>
  <rect y="408" width="900" height="12" fill="url(#meander)"/>
  <line x1="50" y1="210" x2="860" y2="210" stroke="#14100d" stroke-width="2"/>
  <g font-size="11" fill="#5c4a3a" text-anchor="middle">
    <line x1="60" y1="204" x2="60" y2="216" stroke="#14100d"/><text x="60" y="230">530</text>
    <line x1="180" y1="204" x2="180" y2="216" stroke="#14100d"/><text x="180" y="230">510</text>
    <line x1="300" y1="204" x2="300" y2="216" stroke="#14100d"/><text x="300" y="230">490</text>
    <line x1="420" y1="204" x2="420" y2="216" stroke="#14100d"/><text x="420" y="230">470</text>
    <line x1="540" y1="204" x2="540" y2="216" stroke="#14100d"/><text x="540" y="230">450</text>
    <line x1="660" y1="204" x2="660" y2="216" stroke="#14100d"/><text x="660" y="230">430</text>
    <line x1="780" y1="204" x2="780" y2="216" stroke="#14100d"/><text x="780" y="230">410</text>
    <text x="840" y="230" font-style="italic">a. C.</text>
  </g>
  <g stroke-width="1" stroke="#7d6a55">
    <line x1="90" y1="210" x2="90" y2="160"/>
    <line x1="300" y1="210" x2="300" y2="262"/>
    <line x1="330" y1="210" x2="330" y2="340"/>
    <line x1="360" y1="210" x2="360" y2="106"/>
    <line x1="408" y1="210" x2="408" y2="318"/>
    <line x1="390" y1="210" x2="390" y2="60"/>
    <line x1="438" y1="210" x2="438" y2="110"/>
    <line x1="462" y1="210" x2="462" y2="262"/>
    <line x1="492" y1="210" x2="492" y2="160"/>
    <line x1="810" y1="210" x2="810" y2="150"/>
  </g>
  <g font-size="12.5" fill="#14100d">
    <circle cx="90" cy="210" r="6" fill="#5b6b3a"/><text x="70" y="150">c. 525/4 · nacimiento</text><text x="70" y="136" font-size="10.5" fill="#5c4a3a">(cálculo a partir del Mármol de Paros)</text>
    <circle cx="300" cy="210" r="6" fill="#5b6b3a"/><text x="296" y="278" text-anchor="end">490 · lucha en Maratón</text>
    <circle cx="330" cy="210" r="6" fill="#5b6b3a"/><text x="330" y="356" text-anchor="middle">485/4 · primera victoria</text>
    <circle cx="360" cy="210" r="6" fill="#b5532a"/><text x="356" y="100" text-anchor="end">480 · Salamina (Pausanias)</text>
    <circle cx="390" cy="210" r="6" fill="#b5532a"/><text x="380" y="54">años 470 · Sicilia, corte de Hierón</text>
    <circle cx="408" cy="210" r="6" fill="#5b6b3a"/><text x="408" y="334" text-anchor="middle">472 · Persas</text>
    <circle cx="438" cy="210" r="6" fill="#5b6b3a"/><text x="430" y="104">467 · Siete contra Tebas</text>
    <circle cx="462" cy="210" r="6" fill="#c98b3c"/><text x="452" y="278">c. 463 · Suplicantes (papiro)</text>
    <circle cx="492" cy="210" r="7" fill="#5b6b3a" stroke="#14100d" stroke-width="2"/><text x="484" y="154" font-weight="bold">458 · Orestíada</text>
    <circle cx="504" cy="210" r="6" fill="#5b6b3a"/><text x="514" y="198">456/5 · muerte en Gela</text>
    <circle cx="810" cy="210" r="6" fill="#5b6b3a"/><text x="700" y="144">405 · Ranas de Aristófanes</text>
  </g>
  <g transform="translate(590,294)" font-size="12" fill="#14100d">
    <rect width="296" height="70" rx="6" fill="#f7efe0" stroke="#14100d"/>
    <circle cx="18" cy="16" r="6" fill="#5b6b3a"/><text x="32" y="20">Atestiguado (documento antiguo)</text>
    <circle cx="18" cy="35" r="6" fill="#b5532a"/><text x="32" y="39">Tradición antigua, no comprobable</text>
    <circle cx="18" cy="54" r="6" fill="#c98b3c"/><text x="32" y="58">Reconstrucción moderna</text>
  </g>
  <text x="50" y="384" font-size="11.5" font-style="italic" fill="#5c4a3a">Esquema original. «Atestiguado» indica que una fuente antigua lo afirma, no que sea infalible: las cronologías antiguas también calculaban.</text>
</svg>
